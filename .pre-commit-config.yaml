default_language_version:
  node: lts

repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types: [html]

  - repo: local
    hooks:
      - id: htmlhint
        name: HTMLHint
        entry: htmlhint
        language: node
        additional_dependencies:
          - htmlhint@1.1.2
        types: [html]
